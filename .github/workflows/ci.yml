name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck, formatação e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desafio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage

  docker:
    name: imagem e smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sobe banco, migração e API
        run: |
          cp .env.example .env
          docker compose up --build --detach
      - name: Health check
        run: curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3333/health
      - name: Migrações aplicadas (login inexistente responde 401, não 500)
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:3333/sessions \
            -H 'Content-Type: application/json' \
            -d '{"email":"ninguem@example.com","password":"qualquer-senha"}')
          test "$status" = "401"
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Derruba a stack
        if: always()
        run: docker compose down --volumes
