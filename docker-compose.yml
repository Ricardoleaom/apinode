services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: desafio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desafio"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "src/database/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/desafio
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/desafio
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
    ports:
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
